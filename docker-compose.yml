services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldpulse
      POSTGRES_PASSWORD: fieldpulse
      POSTGRES_DB: fieldpulse
    ports:
      - "5432:5432"
    volumes:
      - fieldpulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpulse -d fieldpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://fieldpulse:fieldpulse@db:5432/fieldpulse
      PORT: 3001
      HOST: 0.0.0.0
      CLIENT_ORIGIN: http://localhost:8080,http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOCATION_TICK_MS: ${LOCATION_TICK_MS:-60000}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  fieldpulse_pg:
