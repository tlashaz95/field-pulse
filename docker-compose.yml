services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldpulse
      POSTGRES_PASSWORD: fieldpulse
      POSTGRES_DB: fieldpulse
    ports:
      - "5432:5432"
    volumes:
      - fieldpulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpulse -d fieldpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list || kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://fieldpulse:fieldpulse@db:5432/fieldpulse
      PORT: 3001
      HOST: 0.0.0.0
      CLIENT_ORIGIN: http://localhost:8080,http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOCATION_TICK_MS: ${LOCATION_TICK_MS:-60000}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: fieldpulse.locations
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  fieldpulse_pg:
