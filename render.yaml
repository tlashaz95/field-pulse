# Optional one-click-ish Render blueprint for API + Postgres.
# Netlify still hosts the frontend; set VITE_API_URL to this API's public URL.

databases:
  - name: fieldpulse-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: fieldpulse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/db/migrate.js && node src/db/seed.js && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldpulse-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3001"
      - key: HOST
        value: "0.0.0.0"
      - key: CLIENT_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
