# Optional Render blueprint: API + Postgres + Static UI (all on Render).
# After deploy, set CLIENT_ORIGIN on the API to the static site URL.

databases:
  - name: fieldpulse-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: fieldpulse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/db/migrate.js && node src/db/seed.js && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldpulse-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: CLIENT_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: LOCATION_TICK_MS
        value: "60000"

  # Publish path is relative to repo root (not client/).
  - type: web
    name: fieldpulse-ui
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
